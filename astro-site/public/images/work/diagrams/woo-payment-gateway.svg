<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="'Geist Sans', -apple-system, sans-serif">
  <defs>
    <radialGradient id="glow2" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#ff8fa3" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#ff8fa3" stop-opacity="0" />
    </radialGradient>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a06068" />
    </marker>
    <marker id="arrowGood" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b8f7a" />
    </marker>
    <marker id="arrowBad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a5a5a" />
    </marker>
  </defs>

  <rect width="960" height="680" fill="#0d0e12" />
  <rect width="960" height="680" fill="url(#glow2)" />

  <text x="60" y="64" fill="#7a7d85" font-family="'Geist Mono', ui-monospace, monospace" font-size="11" letter-spacing="1.5">TRANSACTION ARCHITECTURE</text>
  <text x="60" y="90" fill="#e9e9ec" font-size="20" font-weight="500">Woo Payment Gateway</text>

  <!-- Stage 1: Checkout -->
  <g>
    <rect x="60" y="150" width="190" height="120" rx="16" fill="#131319" stroke="rgba(255,255,255,0.12)" />
    <text x="155" y="196" fill="#e9e9ec" font-size="15" font-weight="500" text-anchor="middle">Checkout UI</text>
    <text x="155" y="218" fill="#8c8f97" font-size="11" text-anchor="middle">WooCommerce hooks</text>
    <text x="155" y="236" fill="#8c8f97" font-size="11" text-anchor="middle">client-side validation</text>
    <text x="155" y="254" fill="#8c8f97" font-size="11" text-anchor="middle">(re-checked server-side)</text>
  </g>

  <line x1="250" y1="188" x2="294" y2="188" stroke="#a06068" stroke-width="1.5" marker-end="url(#arrow2)" />
  <text x="272" y="176" fill="#8c8f97" font-size="9.5" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace">submits</text>

  <!-- Stage 2: Processor -->
  <g>
    <rect x="300" y="150" width="190" height="120" rx="16" fill="#131319" stroke="rgba(255,255,255,0.12)" />
    <text x="395" y="196" fill="#e9e9ec" font-size="15" font-weight="500" text-anchor="middle">Payment Processor</text>
    <text x="395" y="218" fill="#8c8f97" font-size="11" text-anchor="middle">Dominican Republic</text>
    <text x="395" y="236" fill="#8c8f97" font-size="11" text-anchor="middle">market processor</text>
    <text x="395" y="254" fill="#8c8f97" font-size="11" text-anchor="middle">(no official plugin)</text>
  </g>

  <!-- Bad path: client redirect, crossed out -->
  <path d="M395,270 C395,330 155,330 155,280" fill="none" stroke="#7a4a4e" stroke-width="1.3" stroke-dasharray="4,4" marker-end="url(#arrowBad)" />
  <text x="275" y="352" fill="#8a5a5a" font-size="10.5" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace">redirect response</text>
  <text x="275" y="368" fill="#8a5a5a" font-size="10.5" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace">— never trusted alone</text>
  <line x1="230" y1="335" x2="320" y2="349" stroke="#8a5a5a" stroke-width="1.2" />

  <line x1="490" y1="188" x2="534" y2="188" stroke="#6b8f7a" stroke-width="1.5" marker-end="url(#arrowGood)" />
  <text x="512" y="176" fill="#8c8f97" font-size="9.5" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace">confirms</text>

  <!-- Stage 3: Webhook -->
  <g>
    <rect x="540" y="130" width="210" height="160" rx="16" fill="#191113" stroke="#ff8fa3" stroke-opacity="0.35" />
    <text x="645" y="164" fill="#ff8fa3" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" letter-spacing="1" text-anchor="middle">SERVER-TO-SERVER</text>
    <text x="645" y="188" fill="#e9e9ec" font-size="15" font-weight="500" text-anchor="middle">Webhook Endpoint</text>
    <line x1="575" y1="204" x2="715" y2="204" stroke="rgba(255,255,255,0.1)" />
    <text x="645" y="226" fill="#d69aa2" font-size="11" text-anchor="middle">Verifies processor signature</text>
    <text x="645" y="246" fill="#8c8f97" font-size="10.5" text-anchor="middle">idempotent — safe against</text>
    <text x="645" y="262" fill="#8c8f97" font-size="10.5" text-anchor="middle">retried callbacks</text>
  </g>

  <line x1="750" y1="205" x2="794" y2="205" stroke="#6b8f7a" stroke-width="1.5" marker-end="url(#arrowGood)" />

  <!-- Stage 4: Order status -->
  <g>
    <rect x="800" y="150" width="120" height="120" rx="16" fill="#131319" stroke="rgba(255,255,255,0.12)" />
    <text x="860" y="196" fill="#e9e9ec" font-size="14" font-weight="500" text-anchor="middle">Order</text>
    <text x="860" y="212" fill="#e9e9ec" font-size="14" font-weight="500" text-anchor="middle">Status</text>
    <text x="860" y="236" fill="#8c8f97" font-size="10" text-anchor="middle">paid / pending</text>
    <text x="860" y="250" fill="#8c8f97" font-size="10" text-anchor="middle">/ declined</text>
  </g>

  <line x1="60" y1="440" x2="900" y2="440" stroke="rgba(255,255,255,0.08)" />
  <text x="60" y="474" fill="#8c8f97" font-size="12">Order status changes exclusively from the verified webhook — never from the checkout page's own redirect.</text>
  <text x="60" y="498" fill="#8c8f97" font-size="12">Failed and pending transactions are distinct order states, so support can tell "declined" from "awaiting confirmation."</text>

  <g font-family="'Geist Mono', ui-monospace, monospace" font-size="10.5" fill="#6d7078">
    <text x="60" y="560">PHP</text>
    <text x="100" y="560">·</text>
    <text x="120" y="560">WooCommerce</text>
    <text x="240" y="560">·</text>
    <text x="260" y="560">WC_Payment_Gateway</text>
    <text x="420" y="560">·</text>
    <text x="440" y="560">Webhooks</text>
    <text x="530" y="560">·</text>
    <text x="550" y="560">JavaScript</text>
  </g>

  <text x="900" y="620" fill="#4c4f57" font-size="10.5" text-anchor="end" font-family="'Geist Mono', ui-monospace, monospace">ysidroalmonte.com</text>
</svg>
