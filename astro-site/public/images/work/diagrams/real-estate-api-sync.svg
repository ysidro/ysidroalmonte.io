<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="'Geist Sans', -apple-system, sans-serif">
  <defs>
    <radialGradient id="glow" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#d8ff65" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#d8ff65" stop-opacity="0" />
    </radialGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7d8a4a" />
    </marker>
  </defs>

  <rect width="960" height="680" fill="#0d0e12" />
  <rect width="960" height="680" fill="url(#glow)" />

  <text x="60" y="64" fill="#7a7d85" font-family="'Geist Mono', ui-monospace, monospace" font-size="11" letter-spacing="1.5">SYNC ARCHITECTURE</text>
  <text x="60" y="90" fill="#e9e9ec" font-size="20" font-weight="500">Real Estate API Sync</text>

  <!-- Stage 1: External API -->
  <g>
    <rect x="60" y="150" width="180" height="110" rx="16" fill="#131319" stroke="rgba(255,255,255,0.12)" />
    <text x="150" y="196" fill="#e9e9ec" font-size="15" font-weight="500" text-anchor="middle">External API</text>
    <text x="150" y="218" fill="#8c8f97" font-size="11" text-anchor="middle">Real estate data source</text>
    <text x="150" y="236" fill="#8c8f97" font-size="11" text-anchor="middle">(prices, availability)</text>
  </g>

  <line x1="240" y1="205" x2="284" y2="205" stroke="#7d8a4a" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Stage 2: Sync layer -->
  <g>
    <rect x="290" y="130" width="220" height="150" rx="16" fill="#131a10" stroke="#d8ff65" stroke-opacity="0.35" />
    <text x="400" y="164" fill="#d8ff65" font-family="'Geist Mono', ui-monospace, monospace" font-size="10" letter-spacing="1" text-anchor="middle">PHP</text>
    <text x="400" y="188" fill="#e9e9ec" font-size="15" font-weight="500" text-anchor="middle">Sync Layer</text>
    <line x1="330" y1="204" x2="470" y2="204" stroke="rgba(255,255,255,0.1)" />
    <text x="400" y="226" fill="#a8ac57" font-size="11" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace">Fetch → Diff → Write</text>
    <text x="400" y="246" fill="#8c8f97" font-size="10.5" text-anchor="middle">Matched by a stable</text>
    <text x="400" y="262" fill="#8c8f97" font-size="10.5" text-anchor="middle">external ID — not slug/title</text>
  </g>

  <line x1="510" y1="205" x2="554" y2="205" stroke="#7d8a4a" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Stage 3: Custom Post Types -->
  <g>
    <rect x="560" y="150" width="180" height="110" rx="16" fill="#131319" stroke="rgba(255,255,255,0.12)" />
    <text x="650" y="196" fill="#e9e9ec" font-size="15" font-weight="500" text-anchor="middle">Custom Post Types</text>
    <text x="650" y="218" fill="#8c8f97" font-size="11" text-anchor="middle">WordPress</text>
    <text x="650" y="236" fill="#8c8f97" font-size="11" text-anchor="middle">structured listing fields</text>
  </g>

  <line x1="740" y1="205" x2="784" y2="205" stroke="#7d8a4a" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Stage 4: MySQL -->
  <g>
    <rect x="790" y="150" width="120" height="110" rx="16" fill="#131319" stroke="rgba(255,255,255,0.12)" />
    <text x="850" y="196" fill="#e9e9ec" font-size="15" font-weight="500" text-anchor="middle">MySQL</text>
    <text x="850" y="218" fill="#8c8f97" font-size="10.5" text-anchor="middle">Indexed for</text>
    <text x="850" y="234" fill="#8c8f97" font-size="10.5" text-anchor="middle">fast matching</text>
  </g>

  <!-- Retry loop annotation -->
  <path d="M400,280 C400,340 290,340 290,290" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.2" stroke-dasharray="3,4" marker-end="url(#arrow)" />
  <text x="345" y="360" fill="#7a7d85" font-size="10.5" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace">failed runs log + retry —</text>
  <text x="345" y="376" fill="#7a7d85" font-size="10.5" text-anchor="middle" font-family="'Geist Mono', ui-monospace, monospace">never partial writes</text>

  <!-- Bottom notes -->
  <line x1="60" y1="440" x2="900" y2="440" stroke="rgba(255,255,255,0.08)" />
  <text x="60" y="474" fill="#8c8f97" font-size="12">Only changed fields are written on each run — editorial overrides and SEO metadata stay intact.</text>
  <text x="60" y="498" fill="#8c8f97" font-size="12">Sync runs are batched, rate-limited, and scheduled during low-traffic windows.</text>

  <g font-family="'Geist Mono', ui-monospace, monospace" font-size="10.5" fill="#6d7078">
    <text x="60" y="560">PHP</text>
    <text x="60" y="580">·</text>
    <text x="90" y="560">WordPress</text>
    <text x="180" y="560">·</text>
    <text x="200" y="560">WP REST API</text>
    <text x="310" y="560">·</text>
    <text x="330" y="560">Custom Post Types</text>
    <text x="470" y="560">·</text>
    <text x="490" y="560">MySQL</text>
  </g>

  <text x="900" y="620" fill="#4c4f57" font-size="10.5" text-anchor="end" font-family="'Geist Mono', ui-monospace, monospace">ysidroalmonte.com</text>
</svg>
